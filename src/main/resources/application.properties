spring.application.name=company-management-system

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${PGHOST:postgres}:${PGPORT:5432}/${PGDATABASE:fixovik}
spring.datasource.username=${PGUSER:fixovik}
spring.datasource.password=${PGPASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
spring.cache.redis.time-to-live=${REDIS_CACHE_TTL:600000}
spring.mvc.favicon.enabled=false
server.forward-headers-strategy=framework

app.default.password=${APP_DEFAULT_PASSWORD:topsecret}
app.remember-me.key=${APP_REMEMBER_ME_KEY:change-me-in-production}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.mvc.hiddenmethod.filter.enabled=true

logging.level.root=INFO
logging.level.ru.rutmiit=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.thymeleaf=WARN

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false
info.app.name=Company management system
info.app.description=Spring Boot application
info.app.version=2.0
info.app.java.version=@java.version@
