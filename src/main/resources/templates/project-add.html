<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head"></head>
<body>
<div th:replace="fragments/navbar"></div>

<main class="container">
    <article class="project-form-wrapper">
        <hgroup class="project-form-header">
            <h1>Добавление проекта</h1>
            <p>Заполните информацию о проекте ниже</p>
        </hgroup>

        <form th:action="@{/projects/add}"
              th:method="post"
              th:object="${projectModel}"
              class="project-form">

            <fieldset>
                <legend>Основная информация</legend>

                <div class="form-grid-2">
                    <label for="name">
                        Название проекта
                        <input th:field="*{name}"
                               th:errorclass="is-invalid"
                               type="text"
                               id="name"
                               placeholder="Введите название проекта"
                               required/>
                        <small th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></small>
                    </label>

                    <label for="address">
                        Адрес/Местоположение
                        <input th:field="*{address}"
                               th:errorclass="is-invalid"
                               type="text"
                               id="address"
                               placeholder="Введите адрес проекта"
                               required/>
                        <small th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-danger"></small>
                    </label>

                    <label for="space">
                        Площадь/Размеры
                        <input th:field="*{space}"
                               th:errorclass="is-invalid"
                               type="text"
                               id="space"
                               placeholder="Например: 100 м² или 10x15 м"
                               required/>
                        <small th:if="${#fields.hasErrors('space')}" th:errors="*{space}" class="text-danger"></small>
                    </label>

                    <label for="description" class="full-width">
                        Описание проекта
                        <textarea th:field="*{description}"
                                  th:errorclass="is-invalid"
                                  id="description"
                                  rows="3"
                                  placeholder="Кратко опишите проект..."
                                  required></textarea>
                        <small th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-danger"></small>
                    </label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Сроки проекта</legend>

                <div class="form-grid-2">
                    <label for="startDate">
                        Дата начала
                        <input th:field="*{startDate}"
                               th:errorclass="is-invalid"
                               type="date"
                               id="startDate"
                               required/>
                        <small th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" class="text-danger"></small>
                    </label>

                    <label for="endDate">
                        Дата окончания (планируемая)
                        <input th:field="*{endDate}"
                               th:errorclass="is-invalid"
                               type="date"
                               id="endDate"
                               required/>
                        <small th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}" class="text-danger"></small>
                    </label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Финансы и параметры проекта</legend>

                <div class="form-grid-2">
                    <label for="salary">
                        Бюджет (руб.)
                        <input th:field="*{salary}"
                               th:errorclass="is-invalid"
                               type="number"
                               step="0.01"
                               min="0"
                               id="salary"
                               placeholder="Введите сумму бюджета"
                               required/>
                        <small th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}" class="text-danger"></small>
                    </label>

                    <div class="radio-group">
                        <span class="radio-group__label">Статус</span>
                        <div class="radio-group__items">
                            <label>
                                <input th:field="*{status}"
                                       th:value="NotStarted"
                                       type="radio"
                                       name="status"/>
                                Не начато
                            </label>
                            <label>
                                <input th:field="*{status}"
                                       th:value="InProgress"
                                       type="radio"
                                       name="status"/>
                                В процессе
                            </label>
                            <label>
                                <input th:field="*{status}"
                                       th:value="Completed"
                                       type="radio"
                                       name="status"/>
                                Завершено
                            </label>
                        </div>
                        <small th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="text-danger"></small>
                    </div>

                    <div class="radio-group full-width">
                        <span class="radio-group__label">Тип объекта</span>
                        <div class="radio-group__items">
                            <label>
                                <input th:field="*{type}"
                                       th:value="ApartamentObject"
                                       type="radio"
                                       name="type"/>
                                Апартаменты
                            </label>
                            <label>
                                <input th:field="*{type}"
                                       th:value="CommercialObject"
                                       type="radio"
                                       name="type"/>
                                Коммерческое помещение
                            </label>
                            <label>
                                <input th:field="*{type}"
                                       th:value="HouseObject"
                                       type="radio"
                                       name="type"/>
                                Дом
                            </label>
                            <label>
                                <input th:field="*{type}"
                                       th:value="LoftObjects"
                                       type="radio"
                                       name="type"/>
                                Лофт
                            </label>
                        </div>
                        <small th:if="${#fields.hasErrors('type')}" th:errors="*{type}" class="text-danger"></small>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Информация о клиенте</legend>

                <div class="form-grid-2">
                    <label for="clientFio">
                        ФИО клиента
                        <input th:field="*{clientFio}"
                               th:errorclass="is-invalid"
                               type="text"
                               id="clientFio"
                               placeholder="Введите ФИО клиента"
                               required/>
                        <small th:if="${#fields.hasErrors('clientFio')}" th:errors="*{clientFio}" class="text-danger"></small>
                    </label>

                    <label for="phoneClient">
                        Телефон клиента или id для связи
                        <input th:field="*{phoneClient}"
                               th:errorclass="is-invalid"
                               type="tel"
                               id="phoneClient"
                               placeholder="+7 (XXX) XXX-XX-XX"
                               required/>
                        <small th:if="${#fields.hasErrors('phoneClient')}" th:errors="*{phoneClient}" class="text-danger"></small>
                    </label>

                    <label for="email" class="full-width">
                        Email клиента
                        <input th:field="*{email}"
                               th:errorclass="is-invalid"
                               type="email"
                               id="email"
                               placeholder="client@example.com"/>
                        <small th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></small>
                    </label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Команда проекта</legend>

                <div class="form-grid-2">
                    <label for="brigadierInput">
                        Бригадир
                        <input type="text"
                               id="brigadierInput"
                               placeholder="Начните вводить ФИО бригадира"
                               list="brigadiersList"
                               autocomplete="off"/>

                        <datalist id="brigadiersList">
                            <option th:each="b : ${brigadiers}"
                                    th:value="${b.fio}"
                                    th:attr="data-id=${b.id}">
                            </option>
                        </datalist>
                        <input type="hidden" th:field="*{brigadierId}" id="brigadierId"/>
                        <small th:if="${#fields.hasErrors('brigadierId')}"
                               th:errors="*{brigadierId}"
                               class="text-danger"></small>
                        <small id="brigadierError" class="text-danger" style="display:none;">
                            Пожалуйста, выберите бригадира из списка.
                        </small>
                    </label>

                    <label class="full-width">
                        Мастера на проекте

                        <div class="master-picker">
                            <input type="text"
                                   id="masterInput"
                                   placeholder="Начните вводить ФИО мастера"
                                   list="mastersList"
                                   autocomplete="off"/>

                            <datalist id="mastersList">
                                <option th:each="m : ${masters}"
                                        th:value="${m.fio} + ' (' + ${m.role} + ')'"
                                        th:attr="data-id=${m.id}">
                                </option>
                            </datalist>

                            <button type="button" class="secondary outline" id="addMasterBtn">
                                Добавить
                            </button>
                        </div>

                        <small id="masterError" class="text-danger" style="display:none;">
                            Выберите мастера из списка и нажмите «Добавить».
                        </small>

                        <div id="selectedMasters" class="selected-masters"></div>

                        <div id="masterIdsHidden"></div>

                        <small th:if="${#fields.hasErrors('masterIds')}"
                               th:errors="*{masterIds}"
                               class="text-danger"></small>
                    </label>

                </div>
            </fieldset>

            <div class="grid form-actions">
                <button type="submit" class="primary">Добавить проект</button>
                <button type="reset" class="secondary">Очистить форму</button>
                <a href="/projects/all" role="button" class="secondary outline">Отмена</a>
            </div>
        </form>
    </article>
</main>

<footer th:replace="fragments/footer"></footer>

<style>
    .project-form-wrapper {
        max-width: 900px;
        margin: 0 auto;
    }

    .project-form-header h1 {
        font-size: 1.6rem;
        margin-bottom: 0.25rem;
    }

    .project-form-header p {
        font-size: 0.9rem;
        color: var(--pico-muted-color);
    }

    .project-form {
        font-size: 0.9rem;
    }

    .project-form fieldset {
        margin-bottom: 1.5rem;
    }

    .project-form legend {
        font-size: 0.95rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
    }

    .form-grid-2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1rem 1.5rem;
    }

    .form-grid-2 .full-width {
        grid-column: 1 / -1;
    }

    .project-form label {
        font-size: 0.9rem;
    }

    .project-form input,
    .project-form textarea,
    .project-form select {
        font-size: 0.9rem;
    }

    .radio-group {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
    }

    .radio-group__label {
        font-size: 0.85rem;
        font-weight: 600;
    }

    .radio-group__items {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.5rem;
        font-size: 0.9rem;
    }

    .form-actions {
        margin-top: 1rem;
    }

    .text-danger {
        font-size: 0.8rem;
    }
    .master-picker {
    display: flex;
    gap: 0.5rem;
    align-items: center;
}

.master-picker input {
    flex: 1;
}

.selected-masters {
    margin-top: 0.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
}

.master-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    border: 1px solid var(--pico-muted-border-color);
    border-radius: 999px;
    padding: 0.25rem 0.6rem;
    font-size: 0.85rem;
    background: var(--pico-muted-background-color);
}

.master-chip button {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 0.95rem;
    line-height: 1;
}

</style>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const input = document.getElementById('brigadierInput');
        const hiddenId = document.getElementById('brigadierId');
        const dataList = document.getElementById('brigadiersList');
        const errorLabel = document.getElementById('brigadierError');

        function updateBrigadierId() {
            const value = input.value;
            const options = dataList.options;
            let foundId = null;

            for (let i = 0; i < options.length; i++) {
                if (options[i].value === value) {
                    foundId = options[i].getAttribute('data-id');
                    break;
                }
            }

            if (foundId) {
                hiddenId.value = foundId;
                if (errorLabel) errorLabel.style.display = 'none';
            } else {
                hiddenId.value = '';
                if (value.trim() !== '' && errorLabel) {
                    errorLabel.style.display = 'block';
                } else if (errorLabel) {
                    errorLabel.style.display = 'none';
                }
            }
        }

        input.addEventListener('change', updateBrigadierId);
        input.addEventListener('input', function () {
            hiddenId.value = '';
        });
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const masterInput = document.getElementById('masterInput');
        const mastersList = document.getElementById('mastersList');
        const addMasterBtn = document.getElementById('addMasterBtn');
        const selectedMasters = document.getElementById('selectedMasters');
        const masterIdsHidden = document.getElementById('masterIdsHidden');
        const masterError = document.getElementById('masterError');
            const selected = new Map();

        function findMasterIdByValue(value) {
            const options = mastersList.options;
            for (let i = 0; i < options.length; i++) {
                if (options[i].value === value) {
                    return options[i].getAttribute('data-id');
                }
            }
            return null;
        }

        function renderSelected() {
            selectedMasters.innerHTML = '';
            masterIdsHidden.innerHTML = '';

            selected.forEach((label, id) => {
                const chip = document.createElement('span');
                chip.className = 'master-chip';
          chip.innerHTML = `
                <span>${label}</span>
                <button type="button" aria-label="Удалить">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            `;

                chip.querySelector('button').addEventListener('click', () => {
                    selected.delete(id);
                    renderSelected();
                });

                selectedMasters.appendChild(chip);

                const hidden = document.createElement('input');
                hidden.type = 'hidden';
                hidden.name = 'masterIds';
                hidden.value = id;
                masterIdsHidden.appendChild(hidden);
            });
        }

        function addMaster() {
            const value = masterInput.value.trim();
            const id = findMasterIdByValue(value);

            if (!id) {
                if (value !== '') {
                    masterError.style.display = 'block';
                }
                return;
            }

            masterError.style.display = 'none';

            if (!selected.has(id)) {
                selected.set(id, value);
                renderSelected();
            }

            masterInput.value = '';
        }

        addMasterBtn.addEventListener('click', addMaster);

        masterInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addMaster();
            }
        });

        masterInput.addEventListener('input', () => {
            masterError.style.display = 'none';
        });
    });
</script>

</body>
</html>
