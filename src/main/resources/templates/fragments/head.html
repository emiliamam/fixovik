<head th:fragment="head" xmlns:th="http://www.thymeleaf.org">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Управление проектами</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

  <style>
    :root {
      --header-bg: #ffffff;
      --header-border: #ececec;
      --header-hover: #f5f5f5;
    }

    nav {
      background: var(--header-bg);
      border-bottom: 1px solid var(--header-border);
      padding: 0.7rem 0;
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width:100%;
      padding-inline: 20px;
    }

    nav ul {
      display: flex;
      gap: 1.25rem;
      align-items: center;
      margin: 0;
    }

    nav li {
      padding: 0 !important;
       margin: 0 !important;
    }

    nav a {
      font-weight: 500;
      color: #333;
    }

    nav a:hover {
      background: var(--header-hover);
      border-radius: 6px;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #111 !important;
    }

    .user-chip {
      padding: 0.35rem 0.7rem;
      border-radius: 20px;
      background: #f3f3f3;
      font-size: 0.9rem;
      font-weight: 500;
    }

    footer {
      margin-top: auto;
      padding: 1rem;
      text-align: center;
      border-top: 1px solid var(--header-border);
    }
  </style>
</head>
