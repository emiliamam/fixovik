<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head"></head>
<body>
<div th:replace="fragments/navbar"></div>

<main class="container">
    <section class="project-task-wrapper">

        <header class="project-task-header">
            <div>
                <h1>
                    Чек-лист по проекту
                    <span class="project-name" th:text="${projectName}">Название проекта</span>
                </h1>
                <p>Отмечайте выполненные задачи и меняйте статус объекта.</p>
            </div>

            <a sec:authorize="hasRole('MODERATOR')"
               th:href="@{/active-projects/project-task/add/{project-name}(project-name=${projectName})}"
               role="button"
               class="primary">
                Добавить новую задачу
            </a>

            <span class="status-badge"
                  th:text="${projectStatus.russian}"
                  th:attr="data-status=${projectStatus}">
            </span>
        </header>

        <div th:if="${successMessage}" class="alert-success">
            <p th:text="${successMessage}"></p>
        </div>
        <div th:if="${errorMessage}" class="alert-error">
            <p th:text="${errorMessage}"></p>
        </div>

        <form th:action="@{/active-projects/project-task/save}"
              method="post"
              class="project-task-form">

            <section sec:authorize="hasRole('MODERATOR')" class="project-status-block">
                <h2>Статус проекта</h2>
                <div class="status-control">
                    <label for="status">
                        Текущий статус:
                        <select id="status" name="status">
                            <option th:each="s : ${statuses}"
                                    th:value="${s}"
                                    th:text="${s.russian}"
                                    th:selected="${s == projectStatus}">
                            </option>
                        </select>
                    </label>
                </div>
            </section>

            <section class="project-checklist">
                <div class="project-checklist-header">
                    <h2>Чек-лист задач</h2>
                    <p th:if="${#lists.isEmpty(projectTask)}" class="muted">
                        Для этого проекта ещё нет задач.
                    </p>
                </div>

                <ul class="task-list"
                    th:if="${projectTask != null and !#lists.isEmpty(projectTask)}">

                    <li th:each="t : ${projectTask}" class="task-item">

                        <label class="task-item__label">
                            <input sec:authorize="hasRole('MODERATOR')"
                                   type="checkbox"
                                   name="completedTaskIds"
                                   th:value="${t.id}"
                                   th:checked="${t.completed}"/>
                            <span th:text="${t.name}">Название задачи</span>
                        </label>

                        <button sec:authorize="hasRole('MODERATOR')"
                                type="submit"
                                class="secondary outline danger-button"
                                th:attr="form=${'deleteTaskForm-' + t.id}"
                                onclick="return confirm('Удалить задачу?')">
                            Удалить
                        </button>

                    </li>
                </ul>
            </section>

            <input type="hidden" name="projectId" th:value="${projectId}"/>

            <footer class="project-task-actions">
                <button sec:authorize="hasRole('MODERATOR')" type="submit" class="primary">
                    Сохранить изменения
                </button>
                <a href="/active-projects/all" role="button" class="secondary outline">
                    Назад к списку объектов
                </a>
            </footer>
        </form>

        <div th:if="${projectTask != null and !#lists.isEmpty(projectTask)}">
            <form th:each="t : ${projectTask}"
                  sec:authorize="hasRole('MODERATOR')"
                  th:id="${'deleteTaskForm-' + t.id}"
                  th:action="@{/active-projects/project-task/delete/{id}(id=${t.id})}"
                  th:method="delete"
                  style="display:none;">
                <input type="hidden" name="projectName" th:value="${projectName}"/>
                <input type="hidden" name="projectId" th:value="${projectId}"/>

            </form>
        </div>

    </section>
    <nav th:if="${totalPages != null && totalPages > 1}" aria-label="Pagination">
        <ul style="display: flex; justify-content: center; list-style: none; padding: 0;">
            <li th:if="${currentPage > 0}">
                <a th:href="@{/projects/all(page=${currentPage - 1}, size=10)}" role="button" class="outline">Назад</a>
            </li>
            <li style="margin: 0 1rem; align-self: center;">
                <span>Страница <strong th:text="${currentPage + 1}"></strong> из <strong th:text="${totalPages}"></strong></span>
            </li>
            <li th:if="${currentPage + 1 < totalPages}">
                <a th:href="@{/projects/all(page=${currentPage + 1}, size=10)}" role="button" class="outline">Вперед</a>
            </li>
        </ul>
    </nav>
</main>

<footer th:replace="fragments/footer"></footer>

<style>
    .project-task-wrapper {
        max-width: 900px;
        margin: 0 auto 2rem;
    }

    .project-task-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
    }

    .project-task-header h1 {
        font-size: 1.5rem;
        margin-bottom: 0.25rem;
    }

    .project-task-header p {
        margin: 0;
        font-size: 0.9rem;
        color: var(--pico-muted-color);
    }

    .project-name {
        font-weight: 600;
    }

    .status-badge {
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        background: var(--pico-muted-background-color);
        color: var(--pico-muted-color);
        white-space: nowrap;
    }
.task-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
}

.task-item__label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
}

.task-delete-btn {
    padding: 0.25rem 0.6rem;
    font-size: 0.8rem;
    border-radius: 8px;
    border: 1px solid var(--pico-muted-border-color);
    background: transparent;
    cursor: pointer;
    white-space: nowrap;
}

.task-delete-btn:hover {
    border-color: #b00020;
    color: #b00020;
}

    .status-badge[data-status='NotStarted'],
    .status-badge[data-status='NOT_STARTED'] {
        background: #ffe5e5;
        color: #b00020;
    }

    .status-badge[data-status='InProgress'],
    .status-badge[data-status='IN_PROGRESS'] {
        background: #fff7d6;
        color: #c58b00;
    }

    .status-badge[data-status='Completed'],
    .status-badge[data-status='COMPLETED'] {
        background: #e3f7e8;
        color: #0b8a3d;
    }

    .project-task-form {
        margin-top: 1rem;
        font-size: 0.9rem;
    }

    .project-status-block {
        margin-bottom: 1.5rem;
        padding: 1rem 1.25rem;
        border-radius: var(--pico-border-radius);
        background: var(--pico-muted-background-color);
    }

    .project-status-block h2 {
        margin: 0 0 0.5rem 0;
        font-size: 1rem;
    }

    .status-control select {
        margin-top: 0.25rem;
    }

    .project-checklist-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        margin-bottom: 0.5rem;
    }

    .project-checklist-header h2 {
        margin: 0;
        font-size: 1rem;
    }

    .muted {
        font-size: 0.85rem;
        color: var(--pico-muted-color);
    }

    .task-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .task-item {
        padding: 0.5rem 0.25rem;
        border-bottom: 1px solid var(--pico-muted-border-color);
    }

    .task-item:last-child {
        border-bottom: none;
    }

    .task-item label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
    }

    .project-task-actions {
        margin-top: 1.5rem;
        display: flex;
        gap: 1rem;
        justify-content: flex-end;
        flex-wrap: wrap;
    }

    .alert-success,
    .alert-error {
        margin-bottom: 1rem;
        padding: 0.75rem 1rem;
        border-radius: var(--pico-border-radius);
        font-size: 0.9rem;
    }

    .alert-success {
        background-color: rgb(255 215 138);
        color: white;
    }

    .alert-error {
        background-color: var(--pico-del-color);
        color: white;
    }
</style>

</body>
</html>
