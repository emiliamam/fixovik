<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head"></head>
<body>
<div th:replace="fragments/navbar"></div>

<main class="container">
    <header class="ap-header">
        <div>
            <h1>Мои действующие объекты</h1>
            <p>Следите за статусом объектов и переходите к чек-листам</p>
        </div>
    </header>

    <section th:if="${successMessage}" class="ap-alert-success">
        <p th:text="${successMessage}"></p>
    </section>

    <section th:if="${project == null or #lists.isEmpty(project)}">
        <article class="ap-empty">
            <h3>У вас пока нет активных объектов</h3>
            <p>Когда администратор назначит вас на проект, он появится здесь.</p>
        </article>
    </section>

    <section th:if="${project != null and not #lists.isEmpty(project)}">
        <div class="ap-table-wrapper">
            <table class="ap-table">
                <thead>
                <tr>
                    <th>Проект</th>
                    <th>Адрес</th>
                    <th>Краткое описание</th>
                    <th style="text-align: center;">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${project}">
                    <td>
                        <strong th:text="${p.name}">Название проекта</strong>
                    </td>
                    <td th:text="${p.address}">Адрес</td>
                    <td th:text="${#strings.abbreviate(p.description, 80)}">Описание</td>
                    <td style="text-align: center;">
                        <a th:href="@{/active-projects/project-task/{project-name}(project-name=${p.name})}"
                           role="button"
                           class="secondary outline">
                            Открыть чек-лист
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>


<style>
    .ap-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 1rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
    }

    .ap-header h1 {
        margin-bottom: 0.25rem;
        font-size: 1.6rem;
    }

    .ap-header p {
        margin: 0;
        font-size: 0.95rem;
        color: var(--pico-muted-color);
    }

    .ap-alert-success {
        padding: 0.9rem 1rem;
        margin-bottom: 1.5rem;
        background-color: rgb(255 215 138);
        border-radius: var(--pico-border-radius);
        color: #fff;
        font-size: 0.9rem;
    }

    .ap-empty {
        padding: 2rem 1.5rem;
        text-align: center;
        border-radius: var(--pico-border-radius);
        border: 1px dashed var(--pico-muted-border-color);
        background: var(--pico-muted-background-color);
    }

    .ap-empty h3 {
        margin-bottom: 0.5rem;
        font-size: 1.2rem;
    }

    .ap-empty p {
        margin: 0;
        font-size: 0.9rem;
        color: var(--pico-muted-color);
    }

    .ap-table-wrapper {
        margin-top: 1rem;
        overflow-x: auto;
    }

    .ap-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
    }

    .ap-table thead {
        background: var(--pico-muted-background-color);
    }

    .ap-table th,
    .ap-table td {
        padding: 0.75rem 0.75rem;
        border-bottom: 1px solid var(--pico-muted-border-color);
        vertical-align: top;
    }

    .ap-table th {
        text-align: left;
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
    }

    .ap-table tbody tr:hover {
        background-color: rgba(0, 0, 0, 0.02);
    }

    .ap-table td strong {
        font-size: 0.95rem;
    }
</style>
</body>
</html>
