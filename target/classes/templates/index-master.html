<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head"></head>
<body>
<div th:replace="fragments/navbar"></div>

<main class="container brigadier-layout">

    <section class="brigadier-hero">
        <div class="brigadier-hero__text">
            <p class="brigadier-hero__label">Кабинет бригадира</p>
            <h1>
                <span>Здравствуйте,</span>
                <span class="brigadier-hero__name">
                    <span sec:authentication="name">Бригадир</span>
                </span>
            </h1>
            <p class="brigadier-hero__subtitle">
                Здесь вы видите свои активные объекты, задачи по проектам и можете быстро перейти к чек-листам.
            </p>

            <div class="brigadier-hero__actions">
                <a href="/active-projects/all" role="button" class="primary">
                    Мои объекты
                </a>

            </div>


        </div>

    </section>

    <section class="brigadier-main">
        <aside class="brigadier-sidebar">
            <section class="brigadier-block tip-block">
                <h3>Подсказка</h3>
                <p>
                    Открывайте объект, переходите к задачам и отмечайте выполненные этапы.
                    Это поможет видеть реальный прогресс по каждому проекту.
                </p>
            </section>
        </aside>
    </section>
</main>

<footer th:replace="fragments/footer"></footer>

<style>
    .brigadier-layout {
        margin-top: 1.5rem;
        margin-bottom: 2rem;
        font-size: 0.95rem;
    }

    /* HERO */
    .brigadier-hero {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 1.1fr);
        gap: 2rem;
        padding: 1.8rem 1.8rem 1.5rem;
        border-radius: var(--pico-border-radius);
        background: linear-gradient(135deg, rgba(0, 153, 255, 0.09), rgba(0, 210, 160, 0.08));
        border: 1px solid var(--pico-muted-border-color);
        margin-bottom: 2rem;
    }

    @media (max-width: 900px) {
        .brigadier-hero {
            grid-template-columns: 1fr;
        }
    }

    .brigadier-hero__label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--pico-muted-color);
        margin: 0 0 0.25rem;
    }

    .brigadier-hero h1 {
        margin: 0 0 0.4rem;
        font-size: 1.5rem;
        line-height: 1.2;
    }

    .brigadier-hero__name {
        font-weight: 600;
    }

    .brigadier-hero__subtitle {
        margin-top: 0;
        max-width: 36rem;
        color: var(--pico-muted-color);
    }

    .brigadier-hero__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin: 1rem 0 0.5rem;
    }

    .brigadier-hero__updated {
        margin-top: 0.25rem;
        color: var(--pico-muted-color);
        font-size: 0.8rem;
    }

    .brigadier-hero__summary {
        display: grid;
        gap: 0.75rem;
        align-content: flex-start;
    }

    .summary-tile {
        padding: 0.75rem 1rem;
        border-radius: var(--pico-border-radius);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--pico-muted-border-color);
    }

    .summary-tile__label {
        display: block;
        font-size: 0.8rem;
        color: var(--pico-muted-color);
        margin-bottom: 0.2rem;
    }

    .summary-tile__value {
        font-size: 1.3rem;
        font-weight: 600;
    }

    .summary-tile__value--danger {
        color: #b00020;
    }

    /* Основной блок: проекты + задачи */
    .brigadier-main {
        display: grid;
        grid-template-columns: minmax(0, 2.1fr) minmax(0, 1.2fr);
        gap: 1.5rem;
    }

    @media (max-width: 1000px) {
        .brigadier-main {
            grid-template-columns: 1fr;
        }
    }

    .brigadier-block {
        border-radius: var(--pico-border-radius);
        border: 1px solid var(--pico-muted-border-color);
        padding: 1.25rem 1.4rem;
        background: white;
    }

    .brigadier-block__header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.6rem;
    }

    .brigadier-block__header h2 {
        margin: 0;
        font-size: 1.05rem;
    }

    /* Бейдж-число */
    .badge {
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        background: var(--pico-muted-background-color);
        color: var(--pico-muted-color);
        white-space: nowrap;
    }

    .empty-state {
        padding: 0.75rem 0.25rem;
        font-size: 0.9rem;
        color: var(--pico-muted-color);
    }

    .empty-state.small {
        padding: 0.25rem 0;
        font-size: 0.85rem;
    }

    /* Таблица проектов */
    .table-wrapper {
        overflow-x: auto;
    }

    .brigadier-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
    }

    .brigadier-table thead tr {
        border-bottom: 1px solid var(--pico-muted-border-color);
    }

    .brigadier-table th,
    .brigadier-table td {
        padding: 0.45rem 0.4rem;
        text-align: left;
        vertical-align: top;
    }

    .brigadier-table tbody tr:nth-child(even) {
        background: var(--pico-muted-background-color);
    }

    .brigadier-table th {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--pico-muted-color);
    }

    .table-actions {
        text-align: right;
        white-space: nowrap;
    }

    /* Статус */
    .status-badge {
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        background: var(--pico-muted-background-color);
        color: var(--pico-muted-color);
        white-space: nowrap;
    }

    .status-badge[data-status='NotStarted'],
    .status-badge[data-status='NOT_STARTED'] {
        background: #ffe5e5;
        color: #b00020;
    }

    .status-badge[data-status='InProgress'],
    .status-badge[data-status='IN_PROGRESS'] {
        background: #fff7d6;
        color: #c58b00;
    }

    .status-badge[data-status='Completed'],
    .status-badge[data-status='COMPLETED'] {
        background: #e3f7e8;
        color: #0b8a3d;
    }

    /* Сайдбар задач */
    .brigadier-sidebar {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .task-list {
        list-style: none;
        margin: 0.5rem 0 0;
        padding: 0;
    }

    .task-item {
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--pico-muted-border-color);
    }

    .task-item:last-child {
        border-bottom: none;
    }

    .task-item__main {
        display: flex;
        flex-direction: column;
    }

    .task-item__project {
        font-size: 0.8rem;
        color: var(--pico-muted-color);
    }

    .task-item__name {
        font-size: 0.9rem;
        font-weight: 500;
    }

    .task-item__meta {
        margin-top: 0.15rem;
        display: flex;
        gap: 0.75rem;
        font-size: 0.8rem;
        color: var(--pico-muted-color);
    }

    .task-item__tag {
        padding: 0.1rem 0.45rem;
        border-radius: 999px;
        border: 1px solid var(--pico-muted-border-color);
    }

    .tip-block {
        background: var(--pico-muted-background-color);
        font-size: 0.85rem;
    }

    .tip-block h3 {
        margin-top: 0;
        font-size: 0.95rem;
    }

    /* Адаптив для таблицы на очень маленьких экранах */
    @media (max-width: 600px) {
        .brigadier-table thead {
            display: none;
        }

        .brigadier-table tr {
            display: block;
            margin-bottom: 0.75rem;
            border-bottom: 1px solid var(--pico-muted-border-color);
        }

        .brigadier-table td {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
        }

        .brigadier-table td::before {
            content: attr(data-label);
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--pico-muted-color);
            margin-right: 0.5rem;
        }

        .table-actions {
            justify-content: flex-end;
        }
    }
</style>

</body>
</html>
