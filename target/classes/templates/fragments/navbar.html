
<nav xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
     xmlns:th="http://www.thymeleaf.org">
    <div class="container" >

        <ul>
            <li>
                <a href="/" >
                    <img th:src="@{/pic/logo.png}" alt="Логотип" width="120" height="120"/>
                </a>
            </li>
        </ul>

        <ul style="padding: 0px">

            <li><a href="/">Главная</a></li>

            <li sec:authorize="hasRole('ADMIN')">
                <a href="/projects/all">Проекты</a>
            </li>

            <li sec:authorize="hasRole('ADMIN')">
                <a href="/masters/all">Мастера</a>
            </li>

            <li sec:authorize="hasAnyRole('MODERATOR', 'USER')">
                <a href="/active-projects/all">Действующие объекты</a>
            </li>

            <li sec:authorize="isAuthenticated()">
                <a href="/users/profile" class="user-chip">
                    <th:block sec:authentication="name"></th:block>
                </a>
            </li>

            <li sec:authorize="isAuthenticated()">
                <form th:method="post" th:action="@{/users/logout}" style="margin: 0;">
                    <button type="submit" class="secondary outline">Выйти</button>
                </form>
            </li>


            <li sec:authorize="!isAuthenticated()">
                <a href="/users/login" class="secondary" role="button">Вход</a>
            </li>
        </ul>
    </div>
</nav>
