<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head"/>
<body class="auth-body">
<div class="navbar">
<div th:replace="fragments/navbar"></div>
</div>
<main class="auth-container">

    <h2 class="auth-title">Добро пожаловать!</h2>

    <form th:action="@{/users/login}" th:method="post" class="auth-form">

        <label>
            Email
            <input id="username"
                   name="username"
                   th:value="${username}"
                   placeholder="Введите email"
                   required>
        </label>

        <label>
            Пароль
            <div class="password-wrapper">
                <input id="password"
                       name="password"
                       type="password"
                       placeholder="Введите пароль"
                       required>
                <span class="toggle-pass" onclick="togglePassword()">
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7z"
                      stroke="currentColor" stroke-width="2" fill="none"/>
                <circle cx="12" cy="12" r="3" fill="currentColor"/>
            </svg>
        </span>
            </div>
        </label>


        <label class="remember-me">
            <input type="checkbox" name="remember-me">
            Запомнить меня
        </label>

        <p class="error" th:if="${badCredentials}">
            Неверный логин или пароль.
        </p>

        <button type="submit" class="auth-btn">ВОЙТИ</button>

        <p class="auth-bottom-text small">
            <a href="#">Забыли пароль?</a>
        </p>
    </form>
</main>

<script>
    function togglePassword() {
        const pass = document.getElementById("password");
        pass.type = pass.type === "password" ? "text" : "password";
    }
</script>

</body>

<style>
    /* Основной фон */
    .auth-body {
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        background: #ffffff;
    }

    .navbar{
        width: 100%;
        padding:10px;
    }
    /* Центральный контейнер */
    .auth-container {
        width: 100%;
        max-width: 360px;
        text-align: center;
    }

    /* Логотип */
    .auth-logo img {
        width: 150px;
        height: 150px;
        margin-bottom: 20px;
    }

    .auth-title {
        font-size: 1.4rem;
        font-weight: 600;
        margin-bottom: 20px;
    }

    /* Форма */
    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .auth-form label {
        text-align: left;
        font-size: 0.9rem;
        font-weight: 500;
    }

    .auth-form input {
        padding: 10px;
        margin-top: 6px;
        border-radius: 6px;
        border: 1px solid #dcdcdc;
        font-size: 0.95rem;
    }

    /* Пароль + иконка */
    .password-wrapper {
        position: relative;
    }
    .password-wrapper input {
        padding-right: 35px;
    }
    .toggle-pass {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        opacity: 0.6;
    }
    .toggle-pass:hover {
        opacity: 1;
    }

    .remember-me {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 0.9rem;
    }

    /* Ошибка */
    .error {
        color: #d9534f;
        font-size: 0.85rem;
        margin-top: -5px;
    }

    /* Кнопка */
    .auth-btn {
        background: #2f9e68;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s ease;
    }
    .auth-btn:hover {
        background: #278a58;
    }

    .auth-bottom-text {
        margin-top: 10px;
        font-size: 0.85rem;
    }

    .auth-bottom-text.small {
        font-size: 0.8rem;
    }

    .auth-bottom-text a {
        color: #2f7ed1;
        text-decoration: none;
    }

    .auth-bottom-text a:hover {
        text-decoration: underline;
    }
</style>

</html>
